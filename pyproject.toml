[project]
name = "agentic-rag-catalogue-tool"
version = "0.1.0"
description = "Agentic RAG Catalogue Tool using Pydantic AI, Logfire, OpenAI, and AsyncPG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.29.0",
    "datasets>=5.0.1",
    "greenlet>=3.5.5",
    "httpx>=0.27.0",
    "pydantic-evals>=2.4.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.1",
    "pydantic-core>=2.0.0",
    "streamlit>=1.63.0",
    "tiktoken>=0.7.0",
    "typing-extensions>=4.0.0",
    "uvicorn>=0.52.4",
    "langfuse>=4.15.4",
    "run>=0.3",
    "torch>=2.14.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
